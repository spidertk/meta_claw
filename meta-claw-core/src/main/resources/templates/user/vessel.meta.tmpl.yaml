# Meta-Claw Vessel Meta Template v1.0
# ==================================
# 此文件是新建 Vessel 时的 YAML 配置模板。
# 初始化时，VesselInitializer 会将 {name} / {created_at} / {description}
# 替换为用户输入的实际值，生成 vessels/<name>/vessel.meta.yaml。
#
# 字段说明：
#   meta          — Vessel 的基本身份标识（显示名、图标、描述等）
#   llm           — 大模型连接配置（可覆盖全局 config.yaml 中的默认值）
#   runtime       — Vessel 的运行时行为（角色、自动服务等）
#   memory        — 记忆存储后端配置
#   tools         — 工具系统配置
#
# 覆盖规则：
#   llm.overrides 中的非空字段会覆盖全局 config.yaml 中对应 provider 的值。
#   例如全局 openai 模型为 gpt-4o，此处 overrides.model = gpt-4o-mini
#   则该 Vessel 实际使用 gpt-4o-mini。

meta:
  # Vessel 的唯一标识（通常与目录名一致）
  id: {name}
  # Vessel 的短名称
  name: {name}
  # 一句话描述该 Vessel 的用途
  description: {description}
  # 创建日期（ISO 格式）
  created_at: {created_at}
  # 显示名称（CLI 列表、欢迎语中展示，~ 表示使用 name）
  display_name: ~
  # 表情符号（默认 🤖）
  emoji: 🤖

llm:
  # 使用的 provider 名称，必须对应全局 config.yaml 中 providers 下的某个 key
  provider: openapi
  # 模型名称（~ 表示使用全局配置的默认模型）
  model: ~
  # Vessel 级覆盖：非空字段会覆盖全局 provider 配置
  overrides:
    api_key: ~        # API 密钥（留空则使用全局配置）
    base_url: ~       # 接口基地址（留空则使用全局配置）
    temperature: ~    # 采样温度（留空则使用全局配置，默认 0.7）
    timeout: ~        # 请求超时秒数（留空则使用全局配置，默认 30）

runtime:
  # Vessel 在系统中的角色（member / admin / guest）
  role: member
  # 是否自动响应（无需用户触发即主动执行）
  auto_serve: false

memory:
  # 短期记忆存储后端（jsonl / memory / ...）
  short_term_store: jsonl
  # 长期记忆存储后端（file / redis / ...）
  long_term_store: file

tools:
  # 要排除的工具列表（按名称排除，空列表表示不排除任何工具）
  exclude: []
