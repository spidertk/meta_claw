# Meta-Claw 主配置文件
# 包含 Spring 应用基础配置、Spring AI OpenAI 配置、Meta-Claw 业务配置及日志级别配置

spring:
  application:
    # 应用名称，用于服务标识和监控
    name: meta-claw

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: https://api.openai.com
      chat:
        enabled: false
#        options:
#          model: gpt-3.5-turbo
    chat:
      observations:
        # 记录发送给 LLM 的提示词内容（生产环境请评估敏感信息泄露风险）
        log-prompt: true
        # 记录 LLM 返回的完成内容
        log-completion: true
        # 记录错误日志
        include-error-logging: true
    mcp:
      client:
        # MCP 客户端总开关。启用后框架会自动收集所有 MCP Server 提供的工具并交给 Agent 使用。
        # stdio 方式需要本地安装 npx；sse/streamable-http 方式只需配置远程 URL。
        enabled: false
        stdio:
          connections:
            filesystem:
              command: npx
              args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
        # sse:
        #   connections:
        #     mysql-mcp:
        #       url: http://localhost:8080

meta:
  claw:
    weixin:
      # 微信渠道总开关；false 时不创建任何账号实例
      enabled: true
      accounts:
        # 1 账号 = 1 微信号 = 1 token = 1 Channel 实例；多账号在此追加
        - account-id: main
          enabled: true
          # openilink 认证令牌（可选）；.meta-claw/channels/weixin/main/login.json 存在时以持久化为准
          token: ${WEIXIN_TOKEN:}
          # openilink 服务基地址（可选），为空使用 SDK 默认
          # base-url: https://ilinkai.weixin.qq.com
          # 默认路由到的 vesselId（可选），为空用系统第一个 Vessel
          # default-vessel-id: ""
          # 私聊白名单（对端 userId）；空 = 不限制（仅建议调试期）
          allow-from: []
          # 群聊绑定（P4 预留）：[{group-id: xxx, vessel-id: yyy, trigger-prefix: "/ai"}]
          groups: []

# Actuator 可观测性端点配置
management:
  endpoints:
    web:
      exposure:
        # 暴露 health、info、metrics、prometheus 端点
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 全局指标标签，便于多实例区分
      application: ${spring.application.name}

# 日志级别配置
logging:
  level:
    # 启用 Spring AI ChatClient 可观测性日志
    org.springframework.ai.chat.client.observation: DEBUG
    # meta.claw 包日志由 ~/.meta-claw/config.yaml 中的 log.debug 控制
    meta.claw: ${META_CLAW_LOG_LEVEL:INFO}
