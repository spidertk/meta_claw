# Meta-Claw 主配置文件
# 包含 Spring 应用基础配置、Spring AI OpenAI 配置、Meta-Claw 业务配置及日志级别配置

spring:
  application:
    # 应用名称，用于服务标识和监控
    name: meta-claw

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: https://api.openai.com
      chat:
        enabled: false
#        options:
#          model: gpt-3.5-turbo
    chat:
      observations:
        # 记录发送给 LLM 的提示词内容（生产环境请评估敏感信息泄露风险）
        log-prompt: true
        # 记录 LLM 返回的完成内容
        log-completion: true
        # 记录错误日志
        include-error-logging: true

meta:
  claw:
    weixin:
      # 微信渠道认证令牌，用于 openilink SDK 登录，优先从环境变量 WEIXIN_TOKEN 读取
      token: ${WEIXIN_TOKEN:}

# Actuator 可观测性端点配置
management:
  endpoints:
    web:
      exposure:
        # 暴露 health、info、metrics、prometheus 端点
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 全局指标标签，便于多实例区分
      application: ${spring.application.name}

# 日志级别配置
logging:
  level:
    # 启用 Spring AI ChatClient 可观测性日志
    org.springframework.ai.chat.client.observation: DEBUG
    # meta.claw 包日志由 ~/.meta-claw/config.yaml 中的 log.debug 控制
    meta.claw: ${META_CLAW_LOG_LEVEL:INFO}
